name: Regenerate AppWizzy submission

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source and generate outputs
        run: |
          python scripts/validate.py
          make generate
          # Keep timeline heuristics out of this directory-entry change.
          git restore --source=33d8d82 -- tool-timeline-data.json
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check
      - name: Commit generated outputs to submission branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tools.json tools.csv TOOLS_LIST.txt tool-timeline-data.json
          git commit -m "Regenerate tool lists after adding AppWizzy"
          git push origin HEAD:patch-1
      - name: Verify generated files stay in sync
        run: |
          make check
          python scripts/generate.py
          git diff --exit-code -- README.md tools.json tools.csv TOOLS_LIST.txt
